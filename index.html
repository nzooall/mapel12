<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Praktikum MikroTik</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      position: relative;
      overflow: hidden;
    }
    body::before, body::after {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      filter: blur(90px);
      z-index: 0;
    }
    body::before { background: rgba(99, 102, 241, 0.5); top: 10%; left: 15%; }
    body::after { background: rgba(236, 72, 153, 0.4); bottom: 10%; right: 15%; }

    .login-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      padding: 40px;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      color: #fff;
    }
    .login-header { text-align: center; margin-bottom: 32px; }
    .login-header .icon-box {
      width: 60px; height: 60px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px auto; font-size: 26px;
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
    }
    .login-header h2 { font-size: 24px; font-weight: 700; letter-spacing: 0.5px; }
    .login-header p { font-size: 13px; color: #94a3b8; margin-top: 6px; }

    .input-group { margin-bottom: 20px; }
    .input-group label { display: block; font-size: 13px; font-weight: 500; color: #cbd5e1; margin-bottom: 8px; }
    .input-wrapper { position: relative; display: flex; align-items: center; }
    .input-wrapper i { position: absolute; left: 16px; color: #94a3b8; font-size: 16px; }
    .input-wrapper input {
      width: 100%; padding: 14px 16px 14px 48px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px; color: #fff; font-size: 14px; outline: none;
      transition: all 0.3s ease;
    }
    .input-wrapper input:focus {
      border-color: #6366f1;
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
    }
    .error-msg {
      color: #f43f5e; font-size: 12px; margin-bottom: 12px; display: none; text-align: center;
    }
    .btn-submit {
      width: 100%; padding: 14px; margin-top: 10px;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      border: none; border-radius: 12px; color: #fff;
      font-size: 15px; font-weight: 600; cursor: pointer;
      box-shadow: 0 8px 20px rgba(79, 70, 229, 0.4); transition: all 0.3s ease;
    }
    .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(79, 70, 229, 0.6); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-header">
      <div class="icon-box">
        <i class="fa-solid fa-network-wired"></i>
      </div>
      <h2>LOGIN PORTAL</h2>
      <p>Login terlebih dahulu sebelum masuk ke dashboard</p>
    </div>

    <div id="errorMsg" class="error-msg">Akun tidak terdaftar atau password salah!</div>

    <form id="loginForm">
      <div class="input-group">
        <label for="username">Username</label>
        <small style="color:#ccc;">keterangan: Untuk isi username dibawah, masukkan nama kalian sendiri</small>
        <div class="input-wrapper">
          <i class="fa-solid fa-user"></i>
          <input type="text" id="username" placeholder="Masukkan Username" required autocomplete="off">
        </div>
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <small style="color:#ccc;">Keterangan: Untuk isi password dibawah ini, masukkan NIS kalian. Contoh: 2412345</small>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="password" placeholder="Masukkan Password" required>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="btnSubmit">
        Masuk <i class="fa-solid fa-arrow-right" style="margin-left: 8px;"></i>
      </button>
    </form>
  </div>

  <!-- Firebase SDK (compat, tidak perlu build tool) -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>

  <script>
    // 1. DILARANG INSPECT ELEMENT / KLIK KANAN / F12
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      if (
        e.key === "F12" ||
        (e.ctrlKey && (e.key === 'u' || e.key === 'U')) ||
        (e.ctrlKey && e.shiftKey && ['I','i','J','j','C','c'].includes(e.key))
      ) {
        e.preventDefault();
        return false;
      }
    });

    // ======================================================================
    // 2. KONFIGURASI FIREBASE
    // GANTI SEMUA NILAI DI BAWAH INI DENGAN firebaseConfig ASLI DARI
    // Firebase Console > Project Settings > Your apps (lihat Langkah 1 panduan)
    // ======================================================================
    const firebaseConfig = {
      apiKey: "AIzaSyC8aotAwiHfV_G23WAIuAjKhP_sXftzNCY",
      authDomain: "mapel12-website.firebaseapp.com",
      databaseURL: "https://mapel12-website-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "mapel12-website",
      storageBucket: "mapel12-website.appspot.com",
      messagingSenderId: "504377192783",
      appId: "1:504377192783:web:11a1fdf2ab8709de3a153a"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // Domain palsu supaya username bisa dipakai sebagai "email" login Firebase
    const EMAIL_DOMAIN = "@mapel12.app";

    // 3. PROSES LOGIN
    const loginForm = document.getElementById("loginForm");
    const btnSubmit = document.getElementById("btnSubmit");
    const errorMsg = document.getElementById("errorMsg");

    loginForm.addEventListener("submit", async function (e) {
      e.preventDefault();

      const userVal = document.getElementById("username").value.trim().toLowerCase();
      const passVal = document.getElementById("password").value.trim();

      errorMsg.style.display = "none";
      btnSubmit.disabled = true;
      btnSubmit.innerText = "Memproses...";

      try {
        // Login ke Firebase Authentication (password dicek di server Firebase, bukan di kode ini)
        await auth.signInWithEmailAndPassword(userVal + EMAIL_DOMAIN, passVal);

        // Kalau berhasil, ambil data nama & role dari Realtime Database
        const res = await fetch(firebaseConfig.databaseURL + "/userProfiles/" + userVal + ".json");
        const profile = await res.json();

        if (!profile) {
          errorMsg.style.display = "block";
          errorMsg.innerText = "Akun ditemukan tapi profil belum diatur admin. Hubungi admin.";
          await auth.signOut();
          return;
        }

        // Simpan sesi ke localStorage, sama seperti sebelumnya
        localStorage.setItem("currentUser", JSON.stringify({
          username: userVal,
          name: profile.name,
          role: profile.role
        }));

        window.location.href = "dashboard.html";
      } catch (err) {
        console.error(err);
        errorMsg.style.display = "block";
        errorMsg.innerText = "Akun tidak terdaftar atau password salah!";
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = 'Masuk <i class="fa-solid fa-arrow-right" style="margin-left: 8px;"></i>';
      }
    });
  </script>

</body>
</html>
