function renderQuiz() {
    const container = document.getElementById('questionsContainer');
    container.innerHTML = '';

    quizData.forEach((data, index) => {
        const qCard = document.createElement('div');
        qCard.className = 'question-card';
        qCard.id = `q-card-${index}`;

        const qText = document.createElement('div');
        qText.className = 'question-text';
        qText.textContent = data.q;
        qCard.appendChild(qText);

        const optionsDiv = document.createElement('div');
        optionsDiv.className = 'options';

        data.options.forEach((opt, optIndex) => {
            const label = document.createElement('label');
            label.className = 'option-label';
            label.id = `label-${index}-${optIndex}`;

            const radio = document.createElement('input');
            radio.type = 'radio';
            radio.name = `question-${index}`;
            radio.value = optIndex;

            label.appendChild(radio);
            label.appendChild(document.createTextNode(opt));
            optionsDiv.appendChild(label);
        });

        qCard.appendChild(optionsDiv);
        container.appendChild(qCard);
    });
}

function submitQuiz() {
    let score = 0;
    let total = quizData.length;

    quizData.forEach((data, index) => {
        const selected = document.querySelector(`input[name="question-${index}"]:checked`);
        const correctOptIndex = data.answer;

        // Clear previous state classes
        for (let i = 0; i < data.options.length; i++) {
            const lbl = document.getElementById(`label-${index}-${i}`);
            lbl.classList.remove('correct', 'wrong');
        }

        // Highlight Jawaban Benar
        const correctLabel = document.getElementById(`label-${index}-${correctOptIndex}`);
        correctLabel.classList.add('correct');

        if (selected) {
            const userAns = parseInt(selected.value);
            if (userAns === correctOptIndex) {
                score++;
            } else {
                const userLabel = document.getElementById(`label-${index}-${userAns}`);
                userLabel.classList.add('wrong');
            }
        }
    });

    const percentage = Math.round((score / total) * 100);
    const resultCard = document.getElementById('resultCard');
    const scoreText = document.getElementById('scoreText');
    const detailText = document.getElementById('detailText');

    resultCard.style.display = 'block';
    scoreText.textContent = `Nilai Anda: ${percentage} / 100`;
    detailText.textContent = `Jumlah jawaban benar: ${score} dari ${total} soal.`;

    window.scrollTo({ top: 0, behavior: 'smooth' });

    // Simpan hasil ke database supaya admin bisa lihat nilainya
    simpanHasilUjian("tlj", percentage, score, total - score, total);
}

// ==== SIMPAN HASIL UJIAN KE FIREBASE (biar admin bisa pantau nilai siswa) ====
const FIREBASE_URL_HASIL = "https://mapel12-website-default-rtdb.asia-southeast1.firebasedatabase.app";

async function simpanHasilUjian(modulId, nilai, benar, salah, totalSoal) {
    try {
        const currentUser = JSON.parse(localStorage.getItem("currentUser"));
        if (!currentUser || !currentUser.username) return; // tidak login, tidak disimpan

        const endpoint = FIREBASE_URL_HASIL + "/examResults/" + modulId + "/" + currentUser.username + ".json";
        await fetch(endpoint, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                name: currentUser.name,
                username: currentUser.username,
                nilai: nilai,
                benar: benar,
                salah: salah,
                totalSoal: totalSoal,
                waktu: Date.now()
            })
        });
    } catch (err) {
        console.error("Gagal menyimpan hasil ujian:", err);
    }
}

function resetQuiz() {
    document.getElementById('quizForm').reset();
    document.getElementById('resultCard').style.display = 'none';

    quizData.forEach((data, index) => {
        for (let i = 0; i < data.options.length; i++) {
            const lbl = document.getElementById(`label-${index}-${i}`);
            lbl.classList.remove('correct', 'wrong');
        }
    });

    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Inisialisasi Soal saat halaman dimuat
renderQuiz();
